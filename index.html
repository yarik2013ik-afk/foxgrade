<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FOX GRADE</title>
<style>
:root {
  --bg: #0d0f17;
  --panel: #181b26;
  --panel-light: #232736;
  --line: #2e3348;
  --accent: #ff8a1f;
  --accent-glow: rgba(255, 138, 31, 0.4);
  --text: #ffffff;
  --muted: #8b93b0;
  --gold: #ffd36a;
  --success: #00ff88;
  --danger: #ff4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding-bottom: 80px;
  overflow-x: hidden;
  user-select: none;
}

button { border: 0; color: white; font: inherit; cursor: pointer; outline: none; }
button:active { transform: scale(0.96); }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

/* --- ШАПКА --- */
.topbar {
  height: 60px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; position: sticky; top: 0; z-index: 50;
  background: rgba(13, 15, 23, 0.95); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.logo { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
.logo .fox { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }
.logo .grade { color: #fff; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.balance {
  display: flex; align-items: center; gap: 6px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 20px; padding: 8px 12px; font-weight: 800; font-size: 14px;
}
.star { color: var(--gold); font-size: 16px; }
.topup {
  background: linear-gradient(135deg, #7b61ff, #5c45eb);
  border-radius: 20px; padding: 9px 14px; font-weight: 800; font-size: 13px;
}
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, #ed5a68, #572b82);
  display: grid; place-items: center; font-size: 18px;
}

/* --- СТРАНИЦЫ --- */
.page { display: none; padding: 16px; animation: fadeIn 0.3s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.section-title { font-size: 20px; font-weight: 900; margin: 20px 0 12px; }

/* --- СЕТКА КЕЙСОВ (TG STYLE) --- */
.case-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.case-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  overflow: hidden; transition: 0.2s; display: flex; flex-direction: column;
  position: relative;
}
.case-card:active { transform: scale(0.97); border-color: var(--accent); }
.case-art {
  height: 110px; display: flex; justify-content: center; align-items: center;
  font-size: 55px; position: relative; overflow: hidden;
}
/* Градиенты и блики как в TG */
.art-purple { background: radial-gradient(circle at 30% 30%, #8c3ed0, #2a1a6c); }
.art-blue { background: radial-gradient(circle at 30% 30%, #368dd2, #153f7a); }
.art-gold { background: radial-gradient(circle at 30% 30%, #dba83f, #684014); }
.art-red { background: radial-gradient(circle at 30% 30%, #d34555, #521c48); }
.art-green { background: radial-gradient(circle at 30% 30%, #31a77a, #124c43); }
.art-orange { background: radial-gradient(circle at 30% 30%, #ff8a1f, #6b3408); }

.case-art::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, transparent 60%);
  pointer-events: none;
}
.case-art .emoji { filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6)); position: relative; z-index: 2; }
.case-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
.case-name { font-size: 14px; font-weight: 800; }
.case-price { font-size: 13px; color: var(--gold); font-weight: 800; }
.btn-open {
  background: linear-gradient(135deg, var(--accent), #e67300);
  padding: 10px; border-radius: 10px; font-weight: 800; font-size: 13px; text-align: center; margin-top: auto;
  box-shadow: 0 4px 15px rgba(255,138,31,0.2);
}

/* --- РУЛЕТКА (МОДАЛКА КЕЙСА) --- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
  z-index: 100; display: none; justify-content: center; align-items: center; padding: 16px;
}
.modal-overlay.active { display: flex; }

.case-modal-box {
  background: var(--panel); border: 1px solid var(--line); border-radius: 24px;
  width: 100%; max-width: 400px; padding: 20px; text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}

/* Рулетка */
.roulette-container {
  height: 130px; background: #090b10; border-radius: 16px; margin: 20px 0;
  position: relative; overflow: hidden; display: flex; align-items: center;
  border: 1px solid var(--line);
}
.roulette-pointer {
  position: absolute; top: 0; bottom: 0; left: 50%; width: 3px;
  background: var(--accent); transform: translateX(-50%); z-index: 10;
  box-shadow: 0 0 15px var(--accent), 0 0 30px var(--accent-glow);
}
.roulette-track {
  display: flex; gap: 10px; padding: 0 10px;
  position: absolute; left: 0; will-change: transform;
}
.roulette-item {
  width: 110px; height: 110px; flex-shrink: 0; background: var(--panel-light);
  border-radius: 14px; display: flex; justify-content: center; align-items: center;
  font-size: 55px; position: relative; border: 1px solid rgba(255,255,255,0.05);
  box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
}
/* Свечение для выигрыша */
.roulette-item.win-glow {
  border-color: var(--gold);
  box-shadow: 0 0 20px var(--gold), inset 0 0 20px rgba(255,211,106,0.2);
}

/* --- АПГРЕЙДЕР --- */
.upgrader-box {
  background: linear-gradient(180deg, var(--panel) 0%, #0d0f17 100%);
  border: 1px solid var(--line); border-radius: 24px; padding: 20px 16px; margin-top: 16px;
}
.dial-container {
  width: 260px; height: 260px; margin: 0 auto 20px; position: relative;
  border-radius: 50%; background: radial-gradient(circle, #1a1e2d 30%, #0d0f17 70%);
  border: 6px solid #2e3348; display: flex; justify-content: center; align-items: center;
  box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.5);
}
/* Стрелка */
.dial-arrow-wrapper {
  position: absolute; inset: 0; border-radius: 50%;
  transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
}
.dial-arrow {
  position: absolute; bottom: 50%; left: 50%; width: 0; height: 0;
  border-left: 12px solid transparent; border-right: 12px solid transparent;
  border-bottom: 25px solid var(--accent);
  transform: translateX(-50%) translateY(-110px);
  filter: drop-shadow(0 0 10px var(--accent));
}
.dial-center-text {
  font-size: 32px; font-weight: 900; color: var(--muted); z-index: 5;
  text-shadow: 0 0 20px rgba(0,0,0,0.8);
}
.upg-selects { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.upg-box {
  background: var(--panel-light); border: 1px dashed var(--line); border-radius: 14px;
  padding: 12px; text-align: center; min-height: 90px; display: flex; flex-direction: column; justify-content: center;
}
.upg-box span { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
.upg-box strong { font-size: 14px; display: block; margin-bottom: 8px; }
.btn-select {
  background: rgba(255,255,255,0.08); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
}
.btn-upgrade-action {
  width: 100%; background: linear-gradient(135deg, var(--accent), #e67300);
  padding: 18px; border-radius: 14px; font-size: 17px; font-weight: 900;
  box-shadow: 0 5px 20px rgba(255,138,31,0.3);
}
.btn-upgrade-action:disabled { background: #2e3348; box-shadow: none; }

/* --- ИНВЕНТАРЬ --- */
.inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.inv-item {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px; display: flex; flex-direction: column; align-items: center; text-align: center;
  position: relative; overflow: hidden;
}
.inv-item::before {
  content: ''; position: absolute; top:0; left:0; right:0; height:40%;
  background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent);
}
.inv-item-icon { font-size: 40px; margin-bottom: 8px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }
.inv-item-name { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.inv-item-price { font-size: 11px; color: var(--gold); margin-bottom: 8px; }
.btn-sell {
  background: #2e3348; width: 100%; padding: 6px; border-radius: 8px; font-size: 11px; font-weight: 700;
}

/* --- НИЖНЕЕ МЕНЮ --- */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
  background: rgba(13, 15, 23, 0.98); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); display: flex; justify-content: space-around;
  align-items: center; z-index: 50; padding: 0 10px;
}
.nav-btn {
  background: none; display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--muted); font-size: 10px; font-weight: 700; transition: 0.2s;
}
.nav-btn .icon { font-size: 20px; transition: 0.2s; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active .icon { transform: scale(1.15); filter: drop-shadow(0 0 8px var(--accent)); }

/* --- МОДАЛКА ВЫБОРА --- */
.select-modal-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; margin-top: 15px; padding-right: 5px; }
.select-modal-list::-webkit-scrollbar { width: 4px; }
.select-modal-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.select-btn {
  display: flex; align-items: center; gap: 12px; background: var(--panel-light);
  padding: 10px 16px; border-radius: 12px; width: 100%; text-align: left;
}
.select-btn .icon { font-size: 30px; }
.select-btn .info { display: flex; flex-direction: column; }
.select-btn .name { font-weight: 800; font-size: 14px; }
.select-btn .price { font-size: 12px; color: var(--gold); }
.btn-close { background: #2e3348; padding: 14px; border-radius: 12px; width: 100%; margin-top: 15px; font-weight: 700; }

.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--panel-light); border: 1px solid var(--line); padding: 12px 24px;
  border-radius: 30px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 200;
  box-shadow: 0 5px 20px rgba(0,0,0,0.5); text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo"><span class="fox">FOX</span><span class="grade">GRADE</span></div>
  <div class="top-actions">
    <div class="balance"><span class="star">⭐</span><span id="ui-balance">1500</span></div>
    <button class="topup" onclick="showToast('Пополнение временно недоступно')">Пополнить</button>
    <div class="avatar">🦊</div>
  </div>
</header>

<!-- ГЛАВНАЯ -->
<main id="page-home" class="page active">
  <h2 class="section-title" style="margin-top:0">Кейсы</h2>
  <div class="case-grid" id="home-cases"></div>
  
  <h2 class="section-title" style="margin-top:30px">Апгрейдер</h2>
  <div class="upgrader-box">
    <div class="dial-container">
      <div class="dial-arrow-wrapper" id="upg-arrow-wrapper">
        <div class="dial-arrow"></div>
      </div>
      <div class="dial-center-text" id="upg-center">0%</div>
    </div>
    <div class="upg-selects">
      <div class="upg-box">
        <span>Твой подарок</span>
        <strong id="upg-source-name">Не выбран</strong>
        <button class="btn-select" onclick="openSelect('source')">Выбрать</button>
      </div>
      <div class="upg-box">
        <span>Хочу получить</span>
        <strong id="upg-target-name">Не выбран</strong>
        <button class="btn-select" onclick="openSelect('target')">Выбрать</button>
      </div>
    </div>
    <button class="btn-upgrade-action" id="btn-upgrade" onclick="doUpgrade()">Улучшить</button>
  </div>
</main>

<!-- ВСЕ КЕЙСЫ -->
<main id="page-cases" class="page">
  <h1 class="section-title" style="margin-top:0">Все кейсы</h1>
  <div class="case-grid" id="all-cases"></div>
</main>

<!-- ИНВЕНТАРЬ -->
<main id="page-inventory" class="page">
  <h1 class="section-title" style="margin-top:0">Мои подарки</h1>
  <div class="inventory-grid" id="inventory-list"></div>
</main>

<!-- НИЖНЕЕ МЕНЮ -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-page="home" onclick="goPage('home')"><span class="icon">🎮</span>Игры</button>
  <button class="nav-btn" data-page="cases" onclick="goPage('cases')"><span class="icon">📦</span>Кейсы</button>
  <button class="nav-btn" data-page="inventory" onclick="goPage('inventory')"><span class="icon">🎒</span>Подарки</button>
</nav>

<!-- МОДАЛКА: РУЛЕТКА -->
<div class="modal-overlay" id="case-modal">
  <div class="case-modal-box">
    <h2 id="case-modal-title" style="font-size:20px; margin-bottom:10px;">Открываем...</h2>
    <div class="roulette-container">
      <div class="roulette-pointer"></div>
      <div class="roulette-track" id="roulette-track"></div>
    </div>
    <button class="btn-close" onclick="closeCaseModal()" id="btn-close-case" style="display:none; background:var(--accent); color:#000;">Забрать</button>
  </div>
</div>

<!-- МОДАЛКА: ВЫБОР -->
<div class="modal-overlay" id="select-modal">
  <div class="case-modal-box">
    <h2 id="select-title" style="font-size:20px;">Выбери предмет</h2>
    <div class="select-modal-list" id="select-list"></div>
    <button class="btn-close" onclick="closeSelectModal()">Отмена</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const SAVE_KEY = "foxgrade_v4";

const CASES = [
  { id:"starter", name:"Стартовый", price:50, art:"🎁", style:"art-orange", items:["teddy","heart","rose","diamond"] },
  { id:"neon", name:"Неоновый", price:120, art:"💎", style:"art-blue", items:["diamond","rocket","heart","ring"] },
  { id:"gold", name:"Золотой", price:300, art:"👑", style:"art-gold", items:["crown","ring","trophy","rocket"] },
  { id:"love", name:"Романтика", price:450, art:"💝", style:"art-red", items:["heart","rose","teddy","ring"] },
  { id:"cyber", name:"Cyber", price:700, art:"🚀", style:"art-blue", items:["rocket","diamond","crown","trophy"] },
  { id:"royal", name:"Королевский", price:1200, art:"🏆", style:"art-gold", items:["crown","trophy","ring","diamond"] },
  { id:"dragon", name:"Драконий", price:1800, art:"🐉", style:"art-green", items:["dragon","crown","trophy","ring"] },
  { id:"nft", name:"NFT-кейс", price:2500, art:"🦩", style:"art-purple", items:["flamingo","crystal","dragon","crown"] }
];

const ITEMS = {
  teddy:{id:"teddy",name:"Мишка",icon:"🧸",price:80},
  heart:{id:"heart",name:"Сердце",icon:"💝",price:100},
  rose:{id:"rose",name:"Роза",icon:"🌹",price:140},
  diamond:{id:"diamond",name:"Алмаз",icon:"💎",price:220},
  rocket:{id:"rocket",name:"Ракета",icon:"🚀",price:280},
  ring:{id:"ring",name:"Кольцо",icon:"💍",price:420},
  crown:{id:"crown",name:"Корона",icon:"👑",price:650},
  trophy:{id:"trophy",name:"Кубок",icon:"🏆",price:850},
  dragon:{id:"dragon",name:"Дракон",icon:"🐉",price:1300},
  flamingo:{id:"flamingo",name:"Фламинго",icon:"🦩",price:1700},
  crystal:{id:"crystal",name:"Кристалл",icon:"🔮",price:2200}
};

let game = { balance: 1500, inventory: [] };
let isOpening = false;

// Утилиты
function fmt(n) { return Math.floor(n).toLocaleString("ru-RU"); }
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t.timer);
  t.timer = setTimeout(() => t.classList.remove("show"), 2500);
}
function updateBalance() {
  document.getElementById("ui-balance").textContent = fmt(game.balance);
}
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(game)); }
function load() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if(s) game = { ...game, ...JSON.parse(s) };
  } catch(e) {}
  if(!Array.isArray(game.inventory)) game.inventory = [];
  updateBalance();
}
function goPage(name) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("page-" + name).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === name);
  });
  if(name === "inventory") renderInventory();
  window.scrollTo(0,0);
}

// Рендер кейсов
function renderCases() {
  const html = CASES.map(c => `
    <div class="case-card" onclick="startCase('${c.id}')">
      <div class="case-art ${c.style}"><div class="emoji">${c.art}</div></div>
      <div class="case-info">
        <div class="case-name">${c.name}</div>
        <div class="case-price">⭐ ${fmt(c.price)}</div>
        <div class="btn-open">Открыть</div>
      </div>
    </div>
  `).join("");
  document.getElementById("home-cases").innerHTML = html;
  document.getElementById("all-cases").innerHTML = html;
}

// Открытие кейса (РУЛЕТКА)
function startCase(id) {
  if(isOpening) return;
  const box = CASES.find(c => c.id === id);
  if(!box) return;
  if(game.balance < box.price) { showToast("Недостаточно звёзд!"); return; }

  game.balance -= box.price;
  updateBalance();
  save();
  isOpening = true;

  const modal = document.getElementById("case-modal");
  const track = document.getElementById("roulette-track");
  const closeBtn = document.getElementById("btn-close-case");
  
  modal.classList.add("active");
  closeBtn.style.display = "none";
  document.getElementById("case-modal-title").textContent = box.name;

  // Лента (30 элементов, 24-й - выигрыш)
  let trackHtml = "";
  const totalItems = 30;
  const winIndex = 24;
  const winItemId = box.items[Math.floor(Math.random() * box.items.length)];
  const winItem = ITEMS[winItemId];

  for(let i=0; i<totalItems; i++) {
    const item = i === winIndex ? winItem : ITEMS[box.items[Math.floor(Math.random() * box.items.length)]];
    trackHtml += `<div class="roulette-item" id="roul-item-${i}">${item.icon}</div>`;
  }
  
  track.innerHTML = trackHtml;
  
  // Сброс и запуск
  track.style.transition = "none";
  track.style.transform = "translateX(0)";
  
  setTimeout(() => {
    // Расчет позиции: элемент 110px + gap 10px = 120px
    // Контейнер обычно ~350px, центр 175px. Элемент 110px, левый край на 175 - 55 = 120px
    const gap = 10;
    const itemWidth = 110;
    const containerWidth = track.parentElement.offsetWidth;
    const centerOffset = (containerWidth / 2) - (itemWidth / 2);
    const randomOffset = (Math.random() * 40) - 20; // Рандом в пределах элемента
    
    const targetX = -((winIndex * (itemWidth + gap)) - centerOffset + randomOffset);
    
    track.style.transition = "transform 3.5s cubic-bezier(0.1, 0.7, 0.1, 1)";
    track.style.transform = `translateX(${targetX}px)`;
  }, 50);

  // Завершение
  setTimeout(() => {
    document.getElementById(`roul-item-${winIndex}`).classList.add("win-glow");
    document.getElementById("case-modal-title").textContent = "ТВОЯ НАГРАДА!";
    closeBtn.style.display = "block";
    isOpening = false;

    game.inventory.push({ uid: Date.now(), ...winItem });
    save();
  }, 3600);
}

function closeCaseModal() {
  document.getElementById("case-modal").classList.remove("active");
}

// Инвентарь
function renderInventory() {
  const grid = document.getElementById("inventory-list");
  if(!game.inventory.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px;font-size:14px">Пусто. Открой кейс!</div>`;
    return;
  }
  grid.innerHTML = game.inventory.map(inv => `
    <div class="inv-item">
      <div class="inv-item-icon">${inv.icon}</div>
      <div class="inv-item-name">${inv.name}</div>
      <div class="inv-item-price">⭐ ${fmt(inv.price)}</div>
      <button class="btn-sell" onclick="sellItem(${inv.uid})">Продать</button>
    </div>
  `).join("");
}

function sellItem(uid) {
  const idx = game.inventory.findIndex(i => i.uid === uid);
  if(idx === -1) return;
  const item = game.inventory[idx];
  game.balance += Math.floor(item.price * 0.7);
  game.inventory.splice(idx, 1);
  save();
  updateBalance();
  renderInventory();
  showToast(`Продан ${item.name}`);
}
   </script>

  <script>
"use strict";

let upgSource = null;
let upgTarget = null;
let isUpgrading = false;

function openSelect(type) {
  const modal = document.getElementById("select-modal");
  const list = document.getElementById("select-list");
  document.getElementById("select-title").textContent = type === 'source' ? "Твой предмет" : "Цель";
  
  let html = "";
  if(type === 'source') {
    if(!game.inventory.length) { showToast("Инвентарь пуст!"); return; }
    html = game.inventory.map(inv => `
      <button class="select-btn" onclick="pickSource(${inv.uid})">
        <div class="icon">${inv.icon}</div>
        <div class="info">
          <div class="name">${inv.name}</div>
          <div class="price">⭐ ${fmt(inv.price)}</div>
        </div>
      </button>
    `).join("");
  } else {
    html = Object.values(ITEMS).map(item => `
      <button class="select-btn" onclick="pickTarget('${item.id}')">
        <div class="icon">${item.icon}</div>
        <div class="info">
          <div class="name">${item.name}</div>
          <div class="price">⭐ ${fmt(item.price)}</div>
        </div>
      </button>
    `).join("");
  }
  list.innerHTML = html;
  modal.classList.add("active");
}

function pickSource(uid) {
  upgSource = game.inventory.find(i => i.uid === uid);
  document.getElementById("upg-source-name").textContent = upgSource.icon + " " + upgSource.name;
  closeSelectModal();
  updateUpgChance();
}

function pickTarget(id) {
  upgTarget = ITEMS[id];
  document.getElementById("upg-target-name").textContent = upgTarget.icon + " " + upgTarget.name;
  closeSelectModal();
  updateUpgChance();
}

function closeSelectModal() {
  document.getElementById("select-modal").classList.remove("active");
}

function updateUpgChance() {
  const el = document.getElementById("upg-center");
  if(!upgSource || !upgTarget) {
    el.textContent = "0%";
    return;
  }
  const raw = (upgSource.price / upgTarget.price) * 100;
  const chance = Math.max(1, Math.min(95, raw));
  el.innerHTML = `${Math.floor(chance)}<span style="font-size:20px">%</span>`;
}

function doUpgrade() {
  if(isUpgrading) return;
  if(!upgSource || !upgTarget) { showToast("Выбери предмет и цель!"); return; }
  
  const idx = game.inventory.findIndex(i => i.uid === upgSource.uid);
  if(idx === -1) { showToast("Предмет не найден!"); return; }
  if(upgTarget.price < upgSource.price * 1.2) { showToast("Цель должна быть дороже!"); return; }

  isUpgrading = true;
  const chance = Math.max(1, Math.min(95, (upgSource.price / upgTarget.price) * 100));
  const won = Math.random() * 100 < chance;
  
  const arrow = document.getElementById("upg-arrow-wrapper");
  const center = document.getElementById("upg-center");
  const btn = document.getElementById("btn-upgrade");

  btn.disabled = true;
  center.textContent = "...";
  
  // Крутим стрелку (5 оборотов)
  const spins = 5;
  const randomDeg = Math.floor(Math.random() * 360);
  const totalDeg = (spins * 360) + randomDeg;
  
  arrow.style.transform = `rotate(${totalDeg}deg)`;

  setTimeout(() => {
    game.inventory.splice(idx, 1); // Удаляем источник
    
    if(won) {
      game.inventory.push({ uid: Date.now(), ...upgTarget });
      showToast(`УСПЕХ! Ты получил ${upgTarget.name}`);
      center.innerHTML = `<span style="color:var(--success)">WIN</span>`;
    } else {
      showToast(`Неудача. Предмет потерян.`);
      center.innerHTML = `<span style="color:var(--danger)">LOSE</span>`;
    }

    save();
    updateBalance();
    
    // Сброс
    setTimeout(() => {
      upgSource = null;
      upgTarget = null;
      document.getElementById("upg-source-name").textContent = "Не выбран";
      document.getElementById("upg-target-name").textContent = "Не выбран";
      center.textContent = "0%";
      arrow.style.transition = "none";
      arrow.style.transform = `rotate(0deg)`;
      setTimeout(() => arrow.style.transition = "transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)", 50);
      btn.disabled = false;
      isUpgrading = false;
    }, 2000);
    
  }, 4200); // Длительность анимации
}
  </script>

<script>
"use strict";

// Закрытие модалок по клику на фон
document.querySelectorAll(".modal-overlay").forEach(modal => {
  modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.classList.remove("active");
  });
});

// Инициализация
load();
renderCases();
updateBalance();

</script>
</body>
