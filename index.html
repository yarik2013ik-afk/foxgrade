<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AURIX | V1.0 Beta</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #050508; --panel: #0f111a; --panel-light: #1a1d2d; --line: #2a2e45;
  --accent: #ffaa00; --accent-glow: rgba(255, 170, 0, 0.4); --purple: #7b61ff;
  --text: #ffffff; --muted: #8b93b0; --gold: #ffd36a; --success: #00ff88;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(circle at 50% 0%, #15102a 0%, transparent 50%); }

/* ШАПКА */
.top-profile { display: flex; align-items: center; gap: 12px; padding: 16px; z-index: 10; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--panel-light); border: 2px solid var(--line); overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 24px; flex-shrink: 0; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-info { display: flex; flex-direction: column; }
.profile-name { font-size: 16px; font-weight: 800; }
.profile-lvl { font-size: 12px; color: var(--accent); font-weight: 700; }
.balance-header { margin-left: auto; text-align: right; }
.balance-header .val { font-size: 20px; font-weight: 900; color: var(--gold); }
.online-badge { font-size: 11px; color: var(--success); display: flex; align-items: center; gap: 4px; justify-content: flex-end; margin-top: 2px; }

/* СТРАНИЦЫ */
.page { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding-bottom: 90px; position: relative; }
.page.active { display: flex; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ГЛАВНАЯ */
.game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
.stats-top { display: flex; justify-content: space-around; width: 100%; padding: 10px 20px; margin-bottom: 20px; }
.stat-item { text-align: center; }
.stat-item .label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.stat-item .value { font-size: 16px; font-weight: 800; color: var(--text); }

/* КРУГЛАЯ КНОПКА */
.tap-button { width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #2a2e40, #161922); border: 4px solid var(--accent); box-shadow: 0 0 50px var(--accent-glow), inset 0 0 30px rgba(255, 170, 0, 0.2); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; position: relative; animation: pulseBtn 3s infinite alternate; }
.tap-button:active { transform: scale(0.92); box-shadow: 0 0 80px var(--accent-glow), inset 0 0 50px rgba(255, 170, 0, 0.5); }
@keyframes pulseBtn { 0% { box-shadow: 0 0 40px var(--accent-glow); } 100% { box-shadow: 0 0 60px var(--accent-glow); } }
.tap-title { font-size: 32px; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 20px var(--accent); margin-bottom: 4px; }
.tap-subtitle { font-size: 14px; font-weight: 700; color: var(--muted); letter-spacing: 4px; }
.tap-star { font-size: 40px; margin-top: 8px; filter: drop-shadow(0 0 15px var(--gold)); }

/* КАРТОЧКИ */
.list-container { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.card-header { display: flex; justify-content: space-between; align-items: center; }
.card-title { font-size: 15px; font-weight: 800; }
.card-reward { font-size: 14px; font-weight: 900; color: var(--gold); }
.card-desc { font-size: 12px; color: var(--muted); }
.btn-claim { background: var(--panel-light); border: 1px solid var(--line); padding: 6px 14px; border-radius: 8px; font-weight: 800; font-size: 12px; color: var(--text); cursor: pointer; }
.btn-claim.ready { background: var(--success); color: #000; border-color: var(--success); }
.btn-claim:disabled { opacity: 0.5; cursor: not-allowed; }

/* ВЫВОД */
.withdraw-box { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin: 16px; display: flex; flex-direction: column; gap: 15px; }
.input-group input { background: var(--panel-light); border: 1px solid var(--line); padding: 14px; border-radius: 12px; color: #fff; font-size: 18px; font-weight: 700; outline: none; width: 100%; margin-top: 8px; }
.btn-primary { background: linear-gradient(135deg, var(--accent), #e67300); padding: 16px; border-radius: 12px; font-weight: 900; font-size: 16px; color: #000; border: 0; cursor: pointer; }

/* МЕНЮ */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(15, 17, 26, 0.95); backdrop-filter: blur(15px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; z-index: 50; padding: 0 4px; }
.nav-btn { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 9px; font-weight: 700; cursor: pointer; flex: 1; padding: 6px 0; }
.nav-btn .icon { font-size: 20px; }
.nav-btn.active { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

/* ЧАСТИЦЫ */
.particle { position: absolute; width: 8px; height: 8px; background: var(--gold); border-radius: 50%; pointer-events: none; animation: particleAnim 0.6s ease-out forwards; z-index: 100; }
@keyframes particleAnim { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); } }
.floating-text { position: absolute; color: var(--gold); font-weight: 900; font-size: 20px; pointer-events: none; animation: floatUp 0.8s ease-out forwards; text-shadow: 0 0 10px var(--gold); z-index: 100; }
@keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(1.5); } }
.toast { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--panel-light); border: 1px solid var(--line); padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 13px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 200; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="top-profile">
  <div class="avatar" id="user-avatar">🦊</div>
  <div class="profile-info">
    <div class="profile-name" id="user-name">Загрузка...</div>
    <div class="profile-lvl" id="user-level">Уровень 1</div>
  </div>
  <div class="balance-header">
    <div class="val" id="ui-balance">0.000</div>
    <div class="online-badge">🟢 <span id="ui-online">1</span> онлайн</div>
  </div>
</header>

<main id="page-home" class="page active">
  <div class="game-area" id="game-area">
    <div class="stats-top">
      <div class="stat-item"><div class="label">Доход</div><div class="value" id="ui-income">+0.001</div></div>
      <div class="stat-item"><div class="label">Кликов</div><div class="value" id="ui-clicks">0</div></div>
    </div>
    <div class="tap-button" id="tap-btn">
      <div class="tap-title">AURIX</div>
      <div class="tap-subtitle">ТАПАЙ</div>
      <div class="tap-star">⭐</div>
    </div>
  </div>
</main>

<main id="page-shop" class="page"><div class="list-container" id="shop-list"></div></main>
<main id="page-tasks" class="page"><div class="list-container" id="tasks-list"></div></main>
<main id="page-daily" class="page"><div class="list-container" id="daily-list"></div></main>

<main id="page-withdraw" class="page">
  <div class="withdraw-box">
    <h2 style="font-size:20px; text-align:center;">Вывод звёзд</h2>
    <div class="input-group">
      <label>Доступно: <span id="ui-withdraw-balance">0.000</span> ⭐</label>
      <input type="number" id="withdraw-amount" placeholder="Сумма (мин. 1.000)" step="0.001">
    </div>
    <button class="btn-primary" onclick="createWithdrawRequest()">Создать заявку</button>
  </div>
  <div class="list-container" id="withdraw-history"></div>
</main>

<main id="page-profile" class="page">
  <div class="list-container">
    <div class="card" style="align-items:center; text-align:center; padding:30px;">
      <div class="avatar" style="width:80px; height:80px; font-size:40px; margin-bottom:10px;" id="prof-avatar">🦊</div>
      <div class="profile-name" id="prof-name">...</div>
      <div style="margin-top:20px; width:100%; display:flex; flex-direction:column; gap:8px;">
        <div style="display:flex; justify-content:space-between; padding:10px; background:var(--panel-light); border-radius:8px;"><span>Всего кликов</span><strong id="prof-clicks">0</strong></div>
        <div style="display:flex; justify-content:space-between; padding:10px; background:var(--panel-light); border-radius:8px;"><span>Заработано</span><strong id="prof-earned">0.000</strong></div>
      </div>
    </div>
  </div>
</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-page="home" onclick="goPage('home')"><span class="icon">⭐</span>Главная</button>
  <button class="nav-btn" data-page="shop" onclick="goPage('shop')"><span class="icon">🛒</span>Улучшения</button>
  <button class="nav-btn" data-page="tasks" onclick="goPage('tasks')"><span class="icon">📋</span>Задания</button>
  <button class="nav-btn" data-page="daily" onclick="goPage('daily')"><span class="icon">🎁</span>Награды</button>
  <button class="nav-btn" data-page="withdraw" onclick="goPage('withdraw')"><span class="icon">💸</span>Вывод</button>
  <button class="nav-btn" data-page="profile" onclick="goPage('profile')"><span class="icon">👤</span>Профиль</button>
</nav>

<div class="toast" id="toast"></div>

<script>
// ВНИМАНИЕ: Это версия работает на LocalStorage (без сервера).
// Чтобы игра работала у тебя сейчас, мы используем локальное сохранение.

const SAVE_KEY = "aurix_beta_local";
let state = {
  balance_micro: 0, total_clicks: 0, total_earned_micro: 0,
  energy: 1000, max_energy: 1000,
  upg_click: 0, upg_regen: 0, upg_max_energy: 0, upg_crit: 0, upg_multiplier: 0, upg_auto: 0, upg_combo: 0
};

function fmt(micro) { return (micro / 1000000).toFixed(3); }

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t.timer); t.timer = setTimeout(() => t.classList.remove("show"), 2500);
}

function goPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("page-" + id).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.page === id));
  if(id === 'shop') renderShop();
  if(id === 'tasks') renderTasks();
  if(id === 'daily') renderDaily();
}

function updateUI() {
  document.getElementById("ui-balance").textContent = fmt(state.balance_micro);
  document.getElementById("ui-clicks").textContent = state.total_clicks;
  document.getElementById("ui-withdraw-balance").textContent = fmt(state.balance_micro);
  document.getElementById("prof-clicks").textContent = state.total_clicks;
  document.getElementById("prof-earned").textContent = fmt(state.total_earned_micro);
  
  // Восстановление энергии (визуально)
  const fill = (state.energy / state.max_energy) * 100;
  // Если у тебя есть полоска энергии в HTML, раскомментируй:
  // document.getElementById("energy-fill").style.width = fill + "%";
}

// Инициализация Telegram
if (window.Telegram?.WebApp) {
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  const u = tg.initDataUnsafe?.user;
  if (u) {
    document.getElementById("user-name").textContent = u.first_name;
    document.getElementById("prof-name").textContent = u.first_name;
    if (u.photo_url) {
      document.getElementById("user-avatar").innerHTML = `<img src="${u.photo_url}">`;
      document.getElementById("prof-avatar").innerHTML = `<img src="${u.photo_url}">`;
    }
  }
} else {
  document.getElementById("user-name").textContent = "Web Tester";
  document.getElementById("prof-name").textContent = "Web Tester";
}

// Загрузка
try {
  const saved = localStorage.getItem(SAVE_KEY);
  if (saved) state = { ...state, ...JSON.parse(saved) };
} catch(e){}

document.getElementById("tap-btn").addEventListener("click", (e) => {
  if (state.energy < 1) { showToast("Нет энергии!"); return; }
  state.energy -= 1;
  state.total_clicks += 1;
  state.balance_micro += 1000; // 0.001
  state.total_earned_micro += 1000;
  
  createParticles(e.clientX, e.clientY);
  createFloatingText(e.clientX, e.clientY, 0.001);
  updateUI();
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
});

function createParticles(x, y) {
  for(let i=0; i<5; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = x + "px"; p.style.top = y + "px";
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 40;
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 600);
  }
}
function createFloatingText(x, y, amount) {
  const el = document.createElement("div");
  el.className = "floating-text";
  el.textContent = "+" + amount.toFixed(3);
  el.style.left = (x - 30) + "px"; el.style.top = (y - 30) + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function renderShop() { document.getElementById("shop-list").innerHTML = "<div class='card'>Улучшения появятся здесь</div>"; }
function renderTasks() { document.getElementById("tasks-list").innerHTML = "<div class='card'>Задания появятся здесь</div>"; }
function renderDaily() { document.getElementById("daily-list").innerHTML = "<div class='card'>Награды появятся здесь</div>"; }

function createWithdrawRequest() {
  showToast("Для вывода нужен сервер!");
}

updateUI();
</script>
</body>
</html>
