<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FOX GRADE | Release</title>
<style>
/* ========== ПЕРЕМЕННЫЕ ========== */
:root {
  --bg: #0b0d14;
  --panel: #161922;
  --panel-light: #212533;
  --line: #2d3347;
  --accent: #ff8a1f;
  --accent-glow: rgba(255, 138, 31, 0.4);
  --text: #ffffff;
  --muted: #8b93b0;
  --gold: #ffd36a;
  --success: #00ff88;
  --danger: #ff4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; overflow-x: hidden; user-select: none; }
button { border: 0; color: white; font: inherit; cursor: pointer; outline: none; transition: 0.1s; }
button:active { transform: scale(0.96); }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

/* ========== ШАПКА ========== */
.topbar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: sticky; top: 0; z-index: 50; background: rgba(11, 13, 20, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
.logo { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
.logo .fox { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }
.logo .grade { color: #fff; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.balance { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 8px 12px; font-weight: 800; font-size: 14px; }
.star { color: var(--gold); font-size: 16px; }
.topup { background: linear-gradient(135deg, #7b61ff, #5c45eb); border-radius: 20px; padding: 9px 14px; font-weight: 800; font-size: 13px; }

/* ========== СТРАНИЦЫ ========== */
.page { display: none; padding: 16px; animation: fadeIn 0.3s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.section-title { font-size: 20px; font-weight: 900; margin: 20px 0 12px; }

/* ========== ТАБЫ ========== */
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn { flex-shrink: 0; padding: 8px 16px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--muted); }
.tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

/* ========== КЕЙСЫ ========== */
.case-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.case-card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: 0.2s; }
.case-card:active { border-color: var(--accent); }
.case-art { height: 140px; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
.art-orange { background: radial-gradient(circle at 50% 50%, #ff8a1f, #8a3d00); box-shadow: inset 0 0 40px rgba(255, 138, 31, 0.5); }
.art-blue { background: radial-gradient(circle at 50% 50%, #3b82f6, #1e3a8a); box-shadow: inset 0 0 40px rgba(59, 130, 246, 0.5); }
.art-purple { background: radial-gradient(circle at 50% 50%, #a855f7, #4c1d95); box-shadow: inset 0 0 40px rgba(168, 85, 247, 0.5); }
.art-gold { background: radial-gradient(circle at 50% 50%, #fbbf24, #78350f); box-shadow: inset 0 0 40px rgba(251, 191, 36, 0.5); }

.case-art::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2) 0%, transparent 60%); }
.case-art .css-item { position: relative; z-index: 2; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

.case-info { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
.case-name { font-size: 15px; font-weight: 800; }
.case-price { font-size: 14px; color: var(--gold); font-weight: 800; }
.btn-open { background: linear-gradient(135deg, var(--accent), #e67300); padding: 12px; border-radius: 12px; font-weight: 800; font-size: 14px; text-align: center; margin-top: auto; box-shadow: 0 4px 15px var(--accent-glow); }

/* ========== CSS-ПОДАРКИ ========== */
.css-item { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; position: relative; }
.css-item::before { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; filter: blur(15px); opacity: 0.6; z-index: -1; }

.item-heart::before { background: #ff3366; }
.item-heart { font-size: 50px; color: #ff3366; text-shadow: 0 0 10px #ff3366, 0 5px 15px rgba(0,0,0,0.5); }
.item-heart::after { content: '❤'; }

.item-teddy { width: 50px; height: 50px; background: #b98248; border-radius: 50%; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5), 0 10px 15px rgba(0,0,0,0.5); }
.item-teddy::before { content: ''; position: absolute; width: 20px; height: 20px; background: #d19a63; border-radius: 50%; top: 10px; left: 15px; box-shadow: 15px 0 0 #d19a63; }

.item-rocket { width: 40px; height: 60px; background: linear-gradient(to bottom, #fff, #ccc); border-radius: 50% 50% 10% 10%; position: relative; box-shadow: 0 10px 15px rgba(0,0,0,0.5); }
.item-rocket::after { content: ''; position: absolute; bottom: -15px; left: 10px; width: 20px; height: 20px; background: #ff5500; border-radius: 50% 50% 0 0; box-shadow: 0 0 15px #ff5500; }

.item-star { font-size: 50px; color: #ffd36a; text-shadow: 0 0 15px #ffd36a, 0 5px 15px rgba(0,0,0,0.5); }
.item-star::after { content: '⭐'; }

.item-ring { width: 45px; height: 45px; border: 8px solid #ffd36a; border-radius: 50%; box-shadow: 0 0 15px #ffd36a, inset 0 0 10px rgba(0,0,0,0.5); position: relative; }
.item-ring::after { content: '💎'; position: absolute; top: -25px; left: 5px; font-size: 20px; }

.item-frog { width: 50px; height: 40px; background: #4caf50; border-radius: 50% 50% 40% 40%; box-shadow: inset 0 -10px 15px rgba(0,0,0,0.3), 0 10px 15px rgba(0,0,0,0.5); position: relative; }
.item-frog::before { content: ''; position: absolute; top: -10px; left: 5px; width: 15px; height: 15px; background: #fff; border-radius: 50%; box-shadow: 25px 0 0 #fff; }
.item-frog::after { content: ''; position: absolute; top: -5px; left: 8px; width: 8px; height: 8px; background: #000; border-radius: 50%; box-shadow: 25px 0 0 #000; }

.item-car { width: 60px; height: 30px; background: #e63946; border-radius: 10px 20px 5px 5px; position: relative; box-shadow: 0 10px 15px rgba(0,0,0,0.5); }
.item-car::before { content: ''; position: absolute; top: -15px; left: 10px; width: 30px; height: 15px; background: #e63946; border-radius: 10px 10px 0 0; }
.item-car::after { content: ''; position: absolute; bottom: -10px; left: 5px; width: 15px; height: 15px; background: #333; border-radius: 50%; box-shadow: 35px 0 0 #333; }

.item-helmet { width: 50px; height: 50px; background: #d4af37; border-radius: 50% 50% 10% 10%; position: relative; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5), 0 10px 15px rgba(0,0,0,0.5); }
.item-helmet::after { content: ''; position: absolute; top: 0; left: -10px; width: 70px; height: 20px; background: #ff3333; border-radius: 10px 10px 0 0; }

.small-item .css-item { transform: scale(0.6); }

/* ========== МОДАЛКИ ========== */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 100; display: none; justify-content: center; align-items: center; padding: 16px; }
.overlay.active { display: flex; }
.modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; width: 100%; max-width: 400px; padding: 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }

/* ========== ЭКРАН КЕЙСА ========== */
.case-screen-box { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; width: 100%; max-width: 450px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.case-screen-header { padding: 16px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--line); position: relative; }
.case-screen-header h2 { font-size: 18px; font-weight: 900; }
.btn-back { position: absolute; left: 16px; font-size: 20px; background: none; color: var(--muted); }
.case-screen-content { flex-grow: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; align-items: center; }

/* ========== РУЛЕТКА ========== */
.roulette-large { height: 120px; width: 100%; background: #090b10; border-radius: 16px; position: relative; overflow: hidden; border: 1px solid var(--line); margin-bottom: 20px; display: flex; align-items: center; }
.roulette-pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background: var(--accent); transform: translateX(-50%); z-index: 10; box-shadow: 0 0 15px var(--accent); }
.roulette-track { display: flex; gap: 10px; padding: 0 10px; position: absolute; left: 0; will-change: transform; }
.roulette-item { width: 100px; height: 100px; flex-shrink: 0; background: var(--panel-light); border-radius: 12px; display: flex; justify-content: center; align-items: center; position: relative; border: 1px solid rgba(255,255,255,0.05); box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
.roulette-item.win-glow { border-color: var(--gold); box-shadow: 0 0 20px var(--gold), inset 0 0 20px rgba(255,211,106,0.3); }
.btn-spin { background: linear-gradient(135deg, var(--accent), #e67300); padding: 16px; border-radius: 14px; font-size: 18px; font-weight: 900; width: 100%; margin-bottom: 20px; }

/* ========== СПИСОК ВЫПАДЕНИЯ ========== */
.case-drop-list { width: 100%; }
.case-drop-list h3 { font-size: 15px; font-weight: 800; margin-bottom: 12px; color: var(--muted); }
.drop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.drop-item { background: var(--panel-light); border-radius: 12px; padding: 12px 8px; text-align: center; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; align-items: center; }
.drop-item .name { font-size: 11px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.drop-item .price { font-size: 10px; color: var(--gold); font-weight: 800; }

/* ========== АПГРЕЙДЕР ========== */
.upgrader-page { display: none; }
.upgrader-page.active { display: block; }
.upg-container { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; }
.prob-circle-wrapper { position: relative; width: 280px; height: 280px; margin: 20px 0; display: flex; justify-content: center; align-items: center; }
.prob-circle-wrapper::before { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.1); }
.prob-circle { width: 100%; height: 100%; border-radius: 50%; position: relative; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 30px rgba(0,0,0,0.5); transition: background 0.3s ease; }
.prob-arrow { position: absolute; bottom: 50%; left: 50%; width: 6px; height: 130px; background: linear-gradient(to top, #fff, #ffd36a); transform-origin: bottom center; transform: translateX(-50%) rotate(0deg); transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1); border-radius: 6px; z-index: 10; box-shadow: 0 0 15px rgba(255, 211, 106, 0.8); }
.prob-arrow::after { content: ''; position: absolute; top: -10px; left: -5px; width: 16px; height: 16px; background: #ffd36a; border-radius: 50%; box-shadow: 0 0 10px #ffd36a; }
.prob-center { width: 90px; height: 90px; background: var(--bg); border-radius: 50%; z-index: 5; display: flex; justify-content: center; align-items: center; border: 3px solid var(--line); box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
.prob-center-text { font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

.upg-stats { display: flex; justify-content: space-between; width: 100%; margin-bottom: 20px; }
.upg-stat-box { text-align: center; flex: 1; background: var(--panel-light); padding: 10px; border-radius: 12px; border: 1px solid var(--line); margin: 0 5px; }
.upg-stat-box span { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
.upg-stat-box strong { font-size: 14px; font-weight: 800; display: block; margin-bottom: 8px; }
.btn-upgrade { background: linear-gradient(135deg, var(--accent), #e67300); padding: 18px; border-radius: 14px; font-size: 18px; font-weight: 900; width: 100%; box-shadow: 0 5px 20px var(--accent-glow); }

.upg-multipliers { display: flex; gap: 8px; width: 100%; margin-bottom: 15px; }
.btn-mult { flex: 1; background: var(--panel-light); border: 1px solid var(--line); padding: 12px; border-radius: 10px; font-weight: 800; font-size: 14px; color: var(--muted); }
.btn-mult.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ========== ИНВЕНТАРЬ ========== */
.select-list { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; margin-top: 15px; padding-right: 5px; }
.select-btn { display: flex; align-items: center; gap: 12px; background: var(--panel-light); padding: 12px 16px; border-radius: 12px; width: 100%; text-align: left; }
.select-btn .info { display: flex; flex-direction: column; }
.select-btn .name { font-weight: 800; font-size: 14px; }
.select-btn .price { font-size: 12px; color: var(--gold); }

.inv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.inv-item { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.inv-item .name { font-size: 12px; font-weight: 700; margin-bottom: 4px; margin-top: 5px; }
.inv-item .price { font-size: 11px; color: var(--gold); margin-bottom: 8px; }
.btn-sell { background: #2e3348; width: 100%; padding: 6px; border-radius: 8px; font-size: 11px; font-weight: 700; }

/* ========== МЕНЮ ========== */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(11, 13, 20, 0.98); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; z-index: 50; }
.nav-btn { background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; font-weight: 700; transition: 0.2s; }
.nav-btn .icon { font-size: 20px; transition: 0.2s; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active .icon { transform: scale(1.15); filter: drop-shadow(0 0 8px var(--accent)); }

.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--panel-light); border: 1px solid var(--line); padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 200; box-shadow: 0 5px 20px rgba(0,0,0,0.5); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo"><span class="fox">FOX</span><span class="grade">GRADE</span></div>
  <div class="top-actions">
    <div class="balance"><span class="star">⭐</span><span id="ui-balance">1500</span></div>
    <button class="topup" onclick="showToast('Пополнение скоро!')">Пополнить</button>
  </div>
</header>

<main id="page-home" class="page active">
  <div class="tabs" id="case-tabs">
    <button class="tab-btn active" onclick="filterCases('all', this)">Все</button>
    <button class="tab-btn" onclick="filterCases('cheap', this)">Стартовые</button>
    <button class="tab-btn" onclick="filterCases('rare', this)">Редкие</button>
    <button class="tab-btn" onclick="filterCases('premium', this)">Премиум</button>
  </div>
  <h2 class="section-title" style="margin-top:0">Кейсы</h2>
  <div class="case-grid" id="cases-grid"></div>
</main>

<main id="page-upgrader" class="page upgrader-page">
  <h2 class="section-title" style="margin-top:0">Апгрейдер</h2>
  <div class="upg-container">
    <div class="prob-circle-wrapper">
      <div class="prob-circle" id="prob-circle" style="background: conic-gradient(var(--panel-light) 0% 100%);">
        <div class="prob-arrow" id="prob-arrow"></div>
        <div class="prob-center"><span class="prob-center-text" id="prob-text">0%</span></div>
      </div>
    </div>
    
    <div class="upg-stats">
      <div class="upg-stat-box">
        <span>Твой предмет</span>
        <strong id="upg-source-name">Не выбран</strong>
        <button style="font-size:12px; background:var(--line); padding:6px 12px; border-radius:8px; width:100%;" onclick="openSelect('source')">Выбрать</button>
      </div>
      <div class="upg-stat-box">
        <span>Хочу получить</span>
        <strong id="upg-target-name">Не выбран</strong>
        <button style="font-size:12px; background:var(--line); padding:6px 12px; border-radius:8px; width:100%;" onclick="openSelect('target')">Выбрать</button>
      </div>
    </div>
    
    <div class="upg-multipliers">
      <button class="btn-mult" onclick="setMultiplier(2, this)">x2</button>
      <button class="btn-mult" onclick="setMultiplier(4, this)">x4</button>
      <button class="btn-mult" onclick="setMultiplier(8, this)">x8</button>
    </div>

    <button class="btn-upgrade" id="btn-upgrade" onclick="doUpgrade()">Улучшить</button>
  </div>
</main>

<main id="page-inventory" class="page">
  <h2 class="section-title" style="margin-top:0">Мои подарки</h2>
  <div class="inv-grid" id="inventory-grid"></div>
</main>

<div class="overlay" id="case-screen">
  <div class="case-screen-box">
    <div class="case-screen-header">
      <button class="btn-back" onclick="closeCaseScreen()">←</button>
      <h2 id="cs-title">Кейс</h2>
    </div>
    <div class="case-screen-content">
      <div class="roulette-large">
        <div class="roulette-pointer"></div>
        <div class="roulette-track" id="cs-track"></div>
      </div>
      <button class="btn-spin" id="cs-spin-btn" onclick="spinCase()">Крутить</button>
      
      <div class="case-drop-list">
        <h3>Что может выпасть</h3>
        <div class="drop-grid" id="cs-drop-grid"></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="select-modal">
  <div class="modal-box">
    <h2 id="select-title" style="font-size:20px;">Выбери предмет</h2>
    <div class="select-list" id="select-list"></div>
    <button style="background:#2e3348; padding:12px; border-radius:12px; width:100%; margin-top:15px; font-weight:700;" onclick="document.getElementById('select-modal').classList.remove('active')">Отмена</button>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-page="home" onclick="goPage('home')"><span class="icon">📦</span>Кейсы</button>
  <button class="nav-btn" data-page="upgrader" onclick="goPage('upgrader')"><span class="icon">⚡</span>Апгрейд</button>
  <button class="nav-btn" data-page="inventory" onclick="goPage('inventory')"><span class="icon">🎒</span>Подарки</button>
</nav>

<div class="toast" id="toast"></div>

<script>

"use strict";

const SAVE_KEY = "foxgrade_v12_release";

// Все предметы с CSS-классами
const ITEMS = {
  stars1: {id:"stars1", name:"1 Звезда", price:1, cssClass:"item-star", isStar:true},
  stars5: {id:"stars5", name:"5 Звёзд", price:5, cssClass:"item-star", isStar:true},
  stars10: {id:"stars10", name:"10 Звёзд", price:10, cssClass:"item-star", isStar:true},
  stars50: {id:"stars50", name:"50 Звёзд", price:50, cssClass:"item-star", isStar:true},
  
  heart:{id:"heart", name:"Сердце", price:15, cssClass:"item-heart"},
  teddy:{id:"teddy", name:"Мишка", price:15, cssClass:"item-teddy"},
  rocket:{id:"rocket", name:"Ракета", price:50, cssClass:"item-rocket"},
  star:{id:"star", name:"Звезда", price:100, cssClass:"item-star"},
  ring:{id:"ring", name:"Кольцо", price:420, cssClass:"item-ring"},
  car:{id:"car", name:"Тачка", price:5947, cssClass:"item-car"},
  frog:{id:"frog", name:"Фрог", price:574231, cssClass:"item-frog"},
  helmet:{id:"helmet", name:"Шлем", price:15069, cssClass:"item-helmet"}
};

const CASES = [
  { id:"start", name:"Стартовый", price:0, art:"item-star", style:"art-orange", category: "cheap", items:["stars1","stars5","heart","teddy"] },
  { id:"sale", name:"Сдача", price:39, art:"item-heart", style:"art-blue", category: "cheap", items:["stars5","stars10","rocket","star"] },
  { id:"mid", name:"Мелочь", price:150, art:"item-ring", style:"art-purple", category: "rare", items:["stars10","stars50","ring","star"] },
  { id:"nft", name:"NFT Кейс", price:500, art:"item-frog", style:"art-gold", category: "premium", items:["stars50","car","helmet","frog"] }
];

let game = { balance: 1500, inventory: [] };
let currentCase = null;
let isSpinning = false;
let upgSource = null;
let upgTarget = null;
let isUpgrading = false;
let currentCategory = "all";

function fmt(n) { return Math.floor(n).toLocaleString("ru-RU"); }
function showToast(msg) {
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t.timer); t.timer = setTimeout(() => t.classList.remove("show"), 2500);
}
function updateBalance() { const el = document.getElementById("ui-balance"); if(el) el.textContent = fmt(game.balance); }
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(game)); }
function load() {
  try { const s = localStorage.getItem(SAVE_KEY); if(s) game = {...game, ...JSON.parse(s)}; } catch(e){}
  if(!Array.isArray(game.inventory)) game.inventory = [];
  updateBalance();
}
function goPage(name) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  const page = document.getElementById("page-" + name);
  if(page) page.classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.page === name));
  if(name === "inventory") renderInventory();
  window.scrollTo(0,0);
}

function filterCases(category, btn) {
  currentCategory = category;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderCases();
}

function renderCases() {
  const grid = document.getElementById("cases-grid");
  if(!grid) return;

  const filtered = CASES.filter(c => currentCategory === "all" || c.category === currentCategory);

  grid.innerHTML = filtered.map(c => `
    <div class="case-card" onclick="openCaseScreen('${c.id}')">
      <div class="case-art ${c.style}">
        <div class="css-item ${c.art}"></div>
      </div>
      <div class="case-info">
        <div class="case-name">${c.name}</div>
        <div class="case-price">⭐ ${c.price === 0 ? 'Бесплатно' : fmt(c.price)}</div>
        <div class="btn-open">Открыть</div>
      </div>
    </div>
  `).join("");
}

function openCaseScreen(id) {
  currentCase = CASES.find(c => c.id === id);
  if(!currentCase) return;

  document.getElementById("case-screen").classList.add("active");
  document.getElementById("cs-title").textContent = currentCase.name;
  
  const track = document.getElementById("cs-track");
  track.style.transition = "none"; track.style.transform = "translateX(0)"; track.innerHTML = "";
  document.getElementById("cs-spin-btn").disabled = false;
  document.getElementById("cs-spin-btn").textContent = "Крутить";
  isSpinning = false;

  const dropGrid = document.getElementById("cs-drop-grid");
  dropGrid.innerHTML = currentCase.items.map(itemId => {
    const item = ITEMS[itemId];
    return `
      <div class="drop-item">
        <div class="css-item ${item.cssClass} small-item" style="transform:scale(0.7)"></div>
        <div class="name">${item.name}</div>
        <div class="price">⭐ ${fmt(item.price)}</div>
      </div>
    `;
  }).join("");
}

function closeCaseScreen() {
  document.getElementById("case-screen").classList.remove("active");
}

function spinCase() {
  if(isSpinning) return;
  if(!currentCase) return;
  if(game.balance < currentCase.price) { showToast("Мало звёзд!"); return; }

  game.balance -= currentCase.price; updateBalance(); save(); isSpinning = true;

  const btn = document.getElementById("cs-spin-btn");
  btn.disabled = true; btn.textContent = "Крутится...";

  const track = document.getElementById("cs-track");
  let trackHtml = "";
  const totalItems = 30;
  const winIndex = 24;
  
  const winItemId = currentCase.items[Math.floor(Math.random() * currentCase.items.length)];
  const winItem = ITEMS[winItemId];

  for(let i=0; i<totalItems; i++) {
    const item = i === winIndex ? winItem : ITEMS[currentCase.items[Math.floor(Math.random() * currentCase.items.length)]];
    trackHtml += `<div class="roulette-item" id="cs-item-${i}"><div class="css-item ${item.cssClass}"></div></div>`;
  }
  track.innerHTML = trackHtml;

  setTimeout(() => {
    const gap = 10, itemWidth = 100;
    const containerWidth = track.parentElement.offsetWidth;
    const centerOffset = (containerWidth / 2) - (itemWidth / 2);
    const randomOffset = (Math.random() * 40) - 20;
    const targetX = -((winIndex * (itemWidth + gap)) - centerOffset + randomOffset);
    
    track.style.transition = "transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)";
    track.style.transform = `translateX(${targetX}px)`;
  }, 50);

  setTimeout(() => {
    const wonEl = document.getElementById(`cs-item-${winIndex}`);
    if(wonEl) wonEl.classList.add("win-glow");
    btn.textContent = "Забрать"; btn.disabled = false; isSpinning = false;
    
    if(winItem.isStar) {
      game.balance += winItem.price;
      updateBalance();
    } else {
      game.inventory.push({ uid: Date.now(), ...winItem });
    }
    save();
    
    btn.onclick = () => { closeCaseScreen(); btn.onclick = spinCase; };
  }, 4100);
}
function renderInventory() {
  const grid = document.getElementById("inventory-grid");
  if(!grid) return;

  if(!game.inventory.length) {
    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--muted); padding:40px 0;">Пусто. Открой кейс!</div>`;
    return;
  }

  grid.innerHTML = game.inventory.map(inv => `
    <div class="inv-item">
      <div class="css-item ${inv.cssClass}"></div>
      <div class="name">${inv.name}</div>
      <div class="price">⭐ ${fmt(inv.price)}</div>
      <button class="btn-sell" onclick="sellItem(${inv.uid})">Продать</button>
    </div>
  `).join("");
}

function sellItem(uid) {
  const idx = game.inventory.findIndex(i => i.uid === uid);
  if(idx === -1) return;
  const item = game.inventory[idx];
  game.balance += Math.floor(item.price * 0.7);
  game.inventory.splice(idx, 1);
  save(); updateBalance(); renderInventory();
  showToast(`Продан ${item.name}`);
}

function openSelect(type) {
  const modal = document.getElementById("select-modal");
  const list = document.getElementById("select-list");
  document.getElementById("select-title").textContent = type === 'source' ? "Твой предмет" : "Цель";
  
  let html = "";
  if(type === 'source') {
    if(!game.inventory.length) { showToast("Инвентарь пуст!"); return; }
    html = game.inventory.map(inv => `
      <button class="select-btn" onclick="pickSource(${inv.uid})">
        <div class="css-item ${inv.cssClass}" style="transform:scale(0.6)"></div>
        <div class="info"><div class="name">${inv.name}</div><div class="price">⭐ ${fmt(inv.price)}</div></div>
      </button>
    `).join("");
  } else {
    const sortedItems = Object.values(ITEMS).filter(i => !i.isStar).sort((a, b) => a.price - b.price);
    html = sortedItems.map(item => `
      <button class="select-btn" onclick="pickTarget('${item.id}')">
        <div class="css-item ${item.cssClass}" style="transform:scale(0.6)"></div>
        <div class="info"><div class="name">${item.name}</div><div class="price">⭐ ${fmt(item.price)}</div></div>
      </button>
    `).join("");
  }
  list.innerHTML = html;
  modal.classList.add("active");
}

function pickSource(uid) {
  upgSource = game.inventory.find(i => i.uid === uid);
  document.getElementById("upg-source-name").textContent = upgSource.name;
  document.getElementById("select-modal").classList.remove("active");
  updateChanceAndWheel();
}

function pickTarget(id) {
  upgTarget = ITEMS[id];
  document.getElementById("upg-target-name").textContent = upgTarget.name;
  document.getElementById("select-modal").classList.remove("active");
  updateChanceAndWheel();
}

function setMultiplier(mult, btn) {
  document.querySelectorAll(".btn-mult").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  if(!upgSource) { showToast("Сначала выбери свой предмет!"); return; }

  const targetPrice = upgSource.price * mult;
  const sortedItems = Object.values(ITEMS).filter(i => !i.isStar).sort((a, b) => a.price - b.price);
  let found = sortedItems.find(i => i.price >= targetPrice);
  if(!found) found = sortedItems[sortedItems.length - 1];

  upgTarget = found;
  document.getElementById("upg-target-name").textContent = upgTarget.name;
  updateChanceAndWheel();
}

function updateChanceAndWheel() {
  const circle = document.getElementById("prob-circle");
  const text = document.getElementById("prob-text");
  
  if(!upgSource || !upgTarget) {
    circle.style.background = `conic-gradient(var(--panel-light) 0% 100%)`;
    text.textContent = "0%";
    return;
  }
  
  const raw = (upgSource.price / upgTarget.price) * 100;
  const chance = Math.max(1, Math.min(95, raw));
  
  circle.style.background = `conic-gradient(from -90deg, var(--success) 0% ${chance}%, var(--danger) ${chance}% 100%)`;
  text.textContent = Math.floor(chance) + "%";
}

function doUpgrade() {
  if(isUpgrading) return;
  if(!upgSource || !upgTarget) { showToast("Выбери предметы!"); return; }
  
  const idx = game.inventory.findIndex(i => i.uid === upgSource.uid);
  if(idx === -1) { showToast("Предмет не найден!"); return; }
  if(upgTarget.price <= upgSource.price) { showToast("Цель должна быть дороже!"); return; }

  isUpgrading = true;
  const chance = Math.max(1, Math.min(95, (upgSource.price / upgTarget.price) * 100));
  const won = Math.random() * 100 < chance;
  
  const arrow = document.getElementById("prob-arrow");
  const btn = document.getElementById("btn-upgrade");
  const text = document.getElementById("prob-text");

  btn.disabled = true; btn.textContent = "Крутим...";
  
  const spins = 5;
  const targetAngle = won ? (Math.random() * chance) : (chance + Math.random() * (100 - chance));
  const totalDeg = (spins * 360) + targetAngle;
  
  arrow.style.transform = `translateX(-50%) rotate(${totalDeg}deg)`;

  setTimeout(() => {
    game.inventory.splice(idx, 1);
    
    if(won) {
      game.inventory.push({ uid: Date.now(), ...upgTarget });
      showToast(`УСПЕХ! Получен ${upgTarget.name}`);
      text.style.color = "var(--success)";
    } else {
      showToast(`ПРОВАЛ. Предмет потерян.`);
      text.style.color = "var(--danger)";
    }
    save(); updateBalance();
    
    setTimeout(() => {
      upgSource = null; upgTarget = null;
      document.getElementById("upg-source-name").textContent = "Не выбран";
      document.getElementById("upg-target-name").textContent = "Не выбран";
      text.style.color = "#fff";
      
      arrow.style.transition = "none";
      arrow.style.transform = `translateX(-50%) rotate(0deg)`;
      setTimeout(() => arrow.style.transition = "transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)", 50);
      
      updateChanceAndWheel();
      btn.disabled = false; btn.textContent = "Улучшить";
      isUpgrading = false;
    }, 2000);
  }, 4200);
}

document.addEventListener("DOMContentLoaded", () => {
  load();
  renderCases();
  updateBalance();
  renderInventory();

  document.querySelectorAll(".overlay").forEach(overlay => {
    overlay.addEventListener("click", (e) => { if(e.target === overlay) overlay.classList.remove("active"); });
  });
});
</script>
</body>
</html>
