<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Игра 1 | Кликер</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background-color: #0b0d14;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Шапка с балансом */
  .topbar {
    height: 70px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 20px;
    background-color: #161922;
    border-bottom: 1px solid #2d3347;
    z-index: 10;
  }

  .balance-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #212533;
    padding: 10px 20px;
    border-radius: 30px;
    border: 1px solid #2d3347;
    font-size: 20px;
    font-weight: 800;
    color: #ffd36a;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  /* Игровое поле */
  .game-area {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Кнопка со звездой */
  .click-btn {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #2a2e40, #161922);
    border: 4px solid #ff8a1f;
    box-shadow: 
      0 0 40px rgba(255, 138, 31, 0.4),
      inset 0 0 30px rgba(255, 138, 31, 0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 100px;
    cursor: pointer;
    transition: transform 0.05s ease, box-shadow 0.1s ease;
    position: relative;
  }

  /* Эффект нажатия */
  .click-btn:active {
    transform: scale(0.92);
    box-shadow: 
      0 0 60px rgba(255, 138, 31, 0.8),
      inset 0 0 40px rgba(255, 138, 31, 0.5);
  }

  /* Внутренняя звезда */
  .click-btn::after {
    content: '⭐';
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
  }

  /* Всплывающий текст (при клике) */
  .floating-text {
    position: absolute;
    color: #ffd36a;
    font-weight: 900;
    font-size: 24px;
    pointer-events: none;
    animation: floatUp 0.8s ease-out forwards;
    text-shadow: 0 0 10px rgba(255, 211, 106, 0.8);
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="balance-box">
      <span>⭐</span>
      <span id="balance">0.00</span>
    </div>
  </div>

  <div class="game-area" id="game-area">
    <!-- Кнопка-кликер -->
    <div class="click-btn" id="click-btn" onclick="handleClick(event)"></div>
  </div>

  <script>
    "use strict";

    const SAVE_KEY = "game1_clicker_balance";
    // Награда за один клик (в твоем ТЗ было 0.0.0.1, но я поставил 0.01 для видимости. 
    // Если нужна именно 0.0001, поменяй значение ниже)
    const REWARD = 0.01; 

    let balance = 0;
    let saveTimer = null;

    const balanceEl = document.getElementById("balance");
    const gameArea = document.getElementById("game-area");

    // Загрузка прогресса
    function loadGame() {
      try {
        const saved = localStorage.getItem(SAVE_KEY);
        if (saved) {
          balance = parseFloat(saved);
        }
      } catch (e) {
        console.error("Ошибка загрузки", e);
      }
      updateBalanceText();
    }

    // Сохранение прогресса
    function saveGame() {
      localStorage.setItem(SAVE_KEY, balance);
    }

    // Обновление текста баланса
    function updateBalanceText() {
      // Отображаем 2 знака после запятой, если дробное, иначе целое
      balanceEl.textContent = balance.toFixed(2);
    }

    // Обработка клика
    function handleClick(event) {
      // Прибавляем баланс
      balance += REWARD;
      updateBalanceText();

      // Отложенное сохранение (чтобы не перегружать браузер)
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveGame, 500);

      // Визуальный эффект (всплывающий текст)
      createFloatingText(event.clientX, event.clientY);
    }

    // Создание всплывающего текста
    function createFloatingText(x, y) {
      const rect = gameArea.getBoundingClientRect();
      const el = document.createElement("div");
      el.className = "floating-text";
      el.textContent = "+" + REWARD;
      
      // Позиционируем относительно игрового поля
      el.style.left = (x - rect.left - 20) + "px";
      el.style.top = (y - rect.top - 20) + "px";
      
      // Небольшой рандом для разлета
      const randomX = (Math.random() - 0.5) * 50;
      el.style.transform = `translateX(${randomX}px)`;
      
      gameArea.appendChild(el);

      // Удаляем элемент после анимации
      setTimeout(() => {
        el.remove();
      }, 800);
    }

    // Запуск
    loadGame();
  </script>
</body>
</html>
